name: docker

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

env:
  IMAGE_NAME: ghcr.io/echoja/tanstack-demo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=sha-${{ github.event.pull_request.head.sha }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,prefix=sha-,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  preview:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_URL: https://tanstack-demo-pr-${{ github.event.pull_request.number }}.echoja.com
      ARGOCD_URL: https://argocd.echoja.com/applications/tanstack-demo-pr-${{ github.event.pull_request.number }}
      MARKER: "<!-- tanstack-demo-preview -->"
    steps:
      - name: Wait for preview health
        id: wait
        continue-on-error: true
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl -fsS --max-time 10 "${PREVIEW_URL}/health" >/dev/null; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "attempt=${attempt}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 5
          done

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "attempt=90" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Upsert preview PR comment
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.wait.outputs.ready }}" = "true" ]; then
            status="Ready"
            detail="Preview responded on /health after ${{ steps.wait.outputs.attempt }} attempt(s)."
          else
            status="Not ready"
            detail="Preview did not respond on /health before the timeout."
          fi

          cat > /tmp/preview-comment.md <<EOF
          ${MARKER}
          ## Preview deployment

          Status: ${status}

          URL: ${PREVIEW_URL}

          Argo CD: ${ARGOCD_URL}

          Image: ghcr.io/echoja/tanstack-demo:sha-${{ github.event.pull_request.head.sha }}

          ${detail}
          EOF

          comment_id="$(
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"${MARKER}\"))) | .id" \
              | head -n 1
          )"

          if [ -n "${comment_id}" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${comment_id}" \
              --field body="$(cat /tmp/preview-comment.md)"
          else
            gh api \
              --method POST \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --field body="$(cat /tmp/preview-comment.md)"
          fi

      - name: Fail if preview is unavailable
        if: steps.wait.outputs.ready != 'true'
        run: exit 1

  update-infra:
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: tanstack-demo-infra-update
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check that this build is still main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "current=$([[ "$latest" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Create infra GitHub App token
        if: steps.current.outputs.current == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: echoja
          repositories: infra
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout infra
        if: steps.current.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          repository: echoja/infra
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Open image update PR
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          export IMAGE_TAG="sha-${GITHUB_SHA::7}"
          branch="bot/update-tanstack-demo-${GITHUB_SHA}"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('apps/tanstack-demo/values.yaml')
          content, count = re.subn(r'(?m)^  tag: sha-[0-9a-f]+$', '  tag: ' + os.environ['IMAGE_TAG'], path.read_text())
          if count != 1:
              raise SystemExit('Expected exactly one pinned image tag')
          path.write_text(content)
          PY
          if git diff --quiet -- apps/tanstack-demo/values.yaml; then
            echo "Infra already uses ${IMAGE_TAG}."
            exit 0
          fi
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git checkout -b "$branch"
            git add apps/tanstack-demo/values.yaml
            git commit -m "Update TanStack Demo image to ${IMAGE_TAG}"
            git push origin "$branch"
          fi
          existing="$(gh pr list --repo echoja/infra --head "$branch" --state all --json number --jq 'length')"
          if [ "$existing" = 0 ]; then
            cat > /tmp/infra-pr-body.md <<BODY
          Updates TanStack Demo to \`${IMAGE_TAG}\` after the successful build of https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}.

          Merging this PR triggers Argo CD auto-sync, including the database migration and deployment rollout.
          BODY
            gh pr create --repo echoja/infra --base main --head "$branch" \
              --title "Update TanStack Demo image to ${IMAGE_TAG}" --body-file /tmp/infra-pr-body.md
          fi
